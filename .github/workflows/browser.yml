name: Browser

# Mobile Chromium + WebKit coverage for the storefront, built from synthetic
# fixtures only (test/fixtures). Required on every push to main and every PR;
# deploy.yml runs the same suite before publishing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    # Match package-lock.json; browsers and OS libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checked-out workspace in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mobile browser suite
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ${{ runner.temp }}/pas-playwright-results/
