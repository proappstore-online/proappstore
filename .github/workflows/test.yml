name: Test

# Runs the build + security regression suite on every PR and every push to
# main. The marketing build installs pinned Astro dependencies and uploads a
# static fixture artifact. Cancels the previous run on rapid pushes.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design system lint
        run: bash scripts/check-design-system.sh .
      - run: npm test
      - name: Build sample marketing artifact
        run: npm run build:marketing -- --snapshot marketing/fixtures/sample.json --assets-dir marketing/fixtures/sample/assets --out marketing/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sample-marketing-site
          path: marketing/dist/
