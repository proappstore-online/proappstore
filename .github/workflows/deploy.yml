name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Astro builder
        run: npm ci

      - name: Reconcile approved catalogue with public inventory and live apps
        run: node scripts/reconcile-catalogue.cjs --out .catalogue-build.json

      - name: Sync App ideas data from FreeAppStore
        # Shared ideas + FAS capabilities from the FAS platform repo's main;
        # keeps the committed copies if FAS is unreachable or the data is invalid.
        run: node scripts/sync-ideas.cjs

      - name: Test storefront
        run: npm test

      - name: Build storefront
        # Generates index.html and apps/{id}/index.html from registry.json
        # via build.js. Build artifacts are gitignored, so we produce them
        # on the runner before deploying — otherwise wrangler uploads only
        # the source files and the deployment ends up with no landing page
        # or detail pages.
        run: npm run build
        env:
          REGISTRY_PATH: .catalogue-build.json

      - name: Build public noindex previews
        run: npm run build:previews

      - name: Publish reconciled public registry
        run: cp .catalogue-build.json registry.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=proappstore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
